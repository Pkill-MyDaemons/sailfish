# Sailfish kernel tuning — /etc/sysctl.d/99-sailfish.conf

# ── Memory ────────────────────────────────────────────────────────────────────
# Low swappiness keeps model weights / game assets in RAM longer
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50
# Required for some AI frameworks (PyTorch, etc.) with large mmap tensors
vm.max_map_count = 2147483642

# ── Network (useful for distributed training, fast model downloads) ────────────
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_mtu_probing = 1

# ── Scheduler ─────────────────────────────────────────────────────────────────
# Helps interactive responsiveness while background compute is running
kernel.sched_autogroup_enabled = 1

# ── Filesystem / inotify ──────────────────────────────────────────────────────
# Prevents "too many open files" errors in large ML repos / IDEs
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# ── Security (keep reasonable hardening) ──────────────────────────────────────
kernel.kptr_restrict = 1
