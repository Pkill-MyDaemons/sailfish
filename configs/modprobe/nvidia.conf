# Sailfish NVIDIA kernel options — /etc/modprobe.d/nvidia.conf

# Preserve VRAM allocations across suspend/resume.
# Without this, every wake-from-sleep forces PyTorch to re-upload model weights.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/tmp

# Required for Wayland compositing (GNOME Wayland session).
# nvidia_drm.fbdev=1 also needed for console framebuffer on boot.
options nvidia_drm modeset=1 fbdev=1

# Enables NVIDIA open kernel module (recommended for Blackwell / RTX 5000+)
# Comment this out if using the legacy proprietary module build.
# options nvidia NVreg_OpenRmEnableUnsupportedGpus=1
