[main]
summary=Sailfish — optimized for AI training, gaming, and compute (Zen 5 / Blackwell)
include=throughput-performance

[cpu]
# Lock cores to performance governor — avoids frequency scaling latency during inference
governor=performance
energy_perf_bias=performance
min_perf_pct=100

[vm]
# madvise lets PyTorch/numpy opt-in to huge pages; avoids fragmenting gaming allocations
transparent_hugepages=madvise

[scheduler]
# Tighter granularity: reduces frame-time variance under background compute load
sched_min_granularity_ns=3000000
sched_wakeup_granularity_ns=4000000
sched_migration_cost_ns=500000

[audio]
# Keep audio daemon hot — avoids stutter when switching between game audio and alerts
timeout=0

[disk]
# mq-deadline: best for NVMe under sustained sequential AI workloads
elevator=mq-deadline
readahead_kb=2048
